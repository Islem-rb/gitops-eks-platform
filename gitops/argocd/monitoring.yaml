apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.11.0
    helm:
      releaseName: kps
      valuesObject:
        fullnameOverride: kps
        defaultRules:
          rules:
            etcd: false
            kubeControllerManager: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeProxy: false
        kubeEtcd: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeProxy: { enabled: false }
        nodeExporter: { enabled: false }
        grafana:
          fullnameOverride: grafana
        prometheus:
          prometheusSpec:
            scrapeInterval: 10s
            evaluationInterval: 10s
            retention: 2d
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 100m, memory: 400Mi }
              limits: { memory: 1Gi }
        alertmanager:
          alertmanagerSpec:
            secrets: [discord-webhook, ops-agent-webhook]
          config:
            route:
              receiver: discord
              group_by: [alertname, namespace]
              group_wait: 10s
              group_interval: 1m
              repeat_interval: 4h
              routes:
                - receiver: "null"
                  matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
                # continue: the alert goes on to Discord as well. The catch-all below is required:
                # once any child route matches, the top-level receiver is no longer used.
                - receiver: ops-agent
                  matchers: ['namespace = "demo"']
                  continue: true
                - receiver: discord
            receivers:
              - name: "null"
              - name: ops-agent
                webhook_configs:
                  - url: http://ops-agent.ops-agent.svc.cluster.local:8080/webhook/alertmanager
                    send_resolved: true # how the agent knows an incident has ended
                    http_config:
                      authorization:
                        type: Bearer
                        credentials_file: /etc/alertmanager/secrets/ops-agent-webhook/token
              - name: discord
                discord_configs:
                  - webhook_url_file: /etc/alertmanager/secrets/discord-webhook/url
                    send_resolved: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
