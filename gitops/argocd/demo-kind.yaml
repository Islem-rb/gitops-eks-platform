apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-kind
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Islem-rb/gitops-eks-platform.git
    targetRevision: main
    path: gitops/apps/demo/overlays/kind
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true      # delete things removed from git
      selfHeal: true   # undo manual changes in the cluster
    syncOptions:
      - CreateNamespace=true
