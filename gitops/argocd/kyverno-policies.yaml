apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Islem-rb/gitops-eks-platform.git
    targetRevision: main
    path: gitops/apps/policies/cel
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
