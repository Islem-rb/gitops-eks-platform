# The image tag below is updated automatically by CI (job bump-gitops in ops-agent.yml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: platform/ops-agent
    newName: 455939971919.dkr.ecr.eu-central-1.amazonaws.com/platform/ops-agent
    newTag: "58efc8148295"
patches:
  - target: { kind: Deployment, name: ops-agent }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - { name: ARGO_APP, value: demo-eks }
          - { name: GITHUB_APP_ID, value: "5626599" }
