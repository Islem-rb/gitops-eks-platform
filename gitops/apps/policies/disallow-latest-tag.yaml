apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  background: true
  rules:
    - name: require-image-tag
      match:
        any: [{ resources: { kinds: [Pod], namespaces: [demo] } }]
      validate:
        failureAction: Enforce
        message: "Images must have an explicit tag."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: no-latest-tag
      match:
        any: [{ resources: { kinds: [Pod], namespaces: [demo] } }]
      validate:
        failureAction: Enforce
        message: "The ':latest' tag is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
