apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources
spec:
  background: true
  rules:
    - name: require-requests-and-memory-limit
      match:
        any: [{ resources: { kinds: [Pod], namespaces: [demo] } }]
      validate:
        failureAction: Audit
        message: "CPU and memory requests and a memory limit are required."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
