# Images pushed to ECR by CI are signed with cosign (keyless, GitHub OIDC).
# Audit only for now: it needs the EKS cluster and registry access from Kyverno to test properly.
# On kind, images are local and do not match, so this policy has no effect there.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-signed-images
spec:
  background: false
  rules:
    - name: verify-cosign-keyless
      match:
        any: [{ resources: { kinds: [Pod], namespaces: [demo] } }]
      verifyImages:
        - imageReferences:
            - "455939971919.dkr.ecr.eu-central-1.amazonaws.com/platform/*"
          failureAction: Audit
          mutateDigest: false
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/Islem-rb/gitops-eks-platform/.github/workflows/app.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
