apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: lab-namespace-only
      expression: object.metadata.namespace == "kyverno-lab"
  validations:
    - expression: |
        object.spec.containers.all(c,
          c.image.matches("^[^@]+:[^/:@]+(@sha256:[a-f0-9]{64})?$")
          && !c.image.matches("^.*:latest(@sha256:[a-f0-9]{64})?$")
        )
      message: Container images must specify an explicit tag other than latest.
