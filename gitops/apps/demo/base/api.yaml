apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: api }
  strategy:
    canary:
      analysis:
        templates:
          - templateName: api-error-rate
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 20
        - pause: { duration: 75s }
        - setWeight: 60
        - pause: { duration: 60s }
        - setWeight: 100
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: platform/api:placeholder
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-db, key: DATABASE_URL } }
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: APP_VERSION
              value: v6-bad
            - name: FAIL_RATE
              value: "0.5"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: http }]
