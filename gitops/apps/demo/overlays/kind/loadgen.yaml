apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels: { app: loadgen }
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "while true; do curl -s -o /dev/null http://api:8000/version; sleep 0.1; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
