# Dummy local credentials for the kind cluster only.
# On EKS this Secret comes from AWS Secrets Manager via External Secrets (Phase 7).
apiVersion: v1
kind: Secret
metadata:
  name: app-db
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app
  POSTGRES_DB: app
  DATABASE_URL: postgresql://app:app@postgres:5432/app
