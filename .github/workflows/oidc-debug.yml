name: oidc-debug

on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Show OIDC claims (not the token itself)
        run: |
          RESP=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "$RESP" | python3 -c "
          import sys,json,base64
          t=json.load(sys.stdin)['value'].split('.')[1]
          t+='='*(-len(t)%4)
          c=json.loads(base64.urlsafe_b64decode(t))
          for k in ('iss','aud','sub','repository','repository_owner','ref','job_workflow_ref'):
              print(k,'=',c.get(k))
          "
      - name: Try the role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
      - run: aws sts get-caller-identity
