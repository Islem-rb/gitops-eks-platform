apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load
  namespace: demo
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: loadgen }   # allowed by the api NetworkPolicy
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:1.3.0
          args: ["run", "/scripts/k6-api.js"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: script, mountPath: /scripts }]
      volumes:
        - name: script
          configMap: { name: k6-script }
